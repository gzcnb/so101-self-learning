name: Offline checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - run: uv run python scripts/check_release.py
      - run: uv run python scripts/offline_demo.py
      - run: uv run python -m unittest discover -s workbench -p 'test_*.py' -v
